<svg width="800" height="200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&amp;display=swap');
      
      .bg { fill: #0a0a0f; }
      .border { fill: none; stroke: #00b4d8; stroke-width: 1.5; opacity: 0.7; }
      .corner { fill: #00b4d8; }
      .label { font-family: 'Share Tech Mono', monospace; fill: #00b4d8; font-size: 11px; letter-spacing: 3px; opacity: 0.8; }
      .name { font-family: 'Share Tech Mono', monospace; fill: #a8d4ff; font-size: 38px; font-weight: bold; letter-spacing: 10px; }
      .sub { font-family: 'Share Tech Mono', monospace; fill: #5b9bd5; font-size: 13px; letter-spacing: 6px; }
      .dot { fill: #00b4d8; }
      .scan { fill: none; stroke: #00b4d8; stroke-width: 0.5; opacity: 0.15; }

      .name {
        animation: glow 3s ease-in-out infinite alternate;
      }
      @keyframes glow {
        from { fill: #a8d4ff; }
        to { fill: #ffffff; filter: drop-shadow(0 0 8px #00b4d8); }
      }
      .border {
        animation: pulse 4s ease-in-out infinite alternate;
      }
      @keyframes pulse {
        from { opacity: 0.4; }
        to { opacity: 1; }
      }
      .dot {
        animation: blink 1.5s step-end infinite;
      }
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
    </style>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="200" class="bg"/>
  
  <!-- Scan lines -->
  <line x1="0" y1="40" x2="800" y2="40" class="scan"/>
  <line x1="0" y1="80" x2="800" y2="80" class="scan"/>
  <line x1="0" y1="120" x2="800" y2="120" class="scan"/>
  <line x1="0" y1="160" x2="800" y2="160" class="scan"/>

  <!-- Main border -->
  <rect x="20" y="15" width="760" height="170" rx="2" class="border"/>
  
  <!-- Corner decorations TL -->
  <rect x="15" y="10" width="12" height="3" class="corner"/>
  <rect x="15" y="10" width="3" height="12" class="corner"/>
  
  <!-- Corner TR -->
  <rect x="773" y="10" width="12" height="3" class="corner"/>
  <rect x="782" y="10" width="3" height="12" class="corner"/>
  
  <!-- Corner BL -->
  <rect x="15" y="177" width="12" height="3" class="corner"/>
  <rect x="15" y="167" width="3" height="12" class="corner"/>
  
  <!-- Corner BR -->
  <rect x="773" y="177" width="12" height="3" class="corner"/>
  <rect x="782" y="167" width="3" height="12" class="corner"/>

  <!-- Top label -->
  <text x="400" y="38" text-anchor="middle" class="label">[ FULL STACK · WEB DEVELOPER ]</text>

  <!-- Blinking dot left -->
  <circle cx="60" cy="35" r="3" class="dot"/>
  
  <!-- Blinking dot right -->
  <circle cx="740" cy="35" r="3" class="dot"/>

  <!-- Main name -->
  <text x="400" y="118" text-anchor="middle" class="name" filter="url(#glow)">444QYY</text>

  <!-- Subtitle -->
  <text x="400" y="155" text-anchor="middle" class="sub">Developer · Creator · Learner</text>
  
  <!-- Bottom dots -->
  <circle cx="390" cy="172" r="2" class="dot"/>
  <circle cx="400" cy="172" r="2" class="dot"/>
  <circle cx="410" cy="172" r="2" class="dot"/>
</svg>
